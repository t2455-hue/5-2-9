<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson 9 단어 시험 - What's in the Bedroom?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF8EF;
    --coral:#FF7A66;
    --coral-dark:#E85F4C;
    --mint:#7FD8B0;
    --mint-dark:#4FB98B;
    --amber:#B4540C;
    --amber-deep:#8A3D08;
    --sun:#FFCF4D;
    --ink:#3D2B22;
    --card:#FFFFFF;
    --line:#F0E3D0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 8% 8%, rgba(255,207,77,0.35) 0, transparent 42%),
      radial-gradient(circle at 92% 88%, rgba(127,216,176,0.35) 0, transparent 45%),
      var(--cream);
    font-family:'Gowun Dodum', sans-serif;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .eng{font-family:'Baloo 2', 'Gowun Dodum', sans-serif;}
  #app{width:100%;max-width:640px;}

  .wave{display:flex; justify-content:center; gap:6px; margin-bottom:6px; font-size:22px; user-select:none;}

  .card{
    background:var(--card);
    border-radius:28px;
    padding:30px 26px;
    box-shadow: 0 14px 0 var(--line), 0 18px 30px rgba(180,84,12,0.08);
    border:3px solid var(--line);
  }

  h1{font-family:'Baloo 2', sans-serif; font-size:26px; color:var(--coral-dark); margin:0 0 2px; text-align:center;}
  .subtitle{text-align:center; color:var(--amber); font-size:15px; margin:0 0 22px;}

  label{display:block; font-size:14px; color:var(--amber-deep); margin:14px 0 6px;}
  input[type=text]{
    width:100%; padding:13px 14px; border-radius:14px; border:2px solid var(--line);
    font-size:16px; font-family:'Gowun Dodum', sans-serif; background:#FFFCF7; color:var(--ink);
  }
  input[type=text]:focus{outline:none; border-color:var(--mint-dark);}
  .hint{font-size:12px; color:#B79A7C; margin-top:5px;}

  .row3{display:flex; gap:10px;}
  .row3 > div{flex:1;}

  .cls-grid{display:flex; flex-wrap:wrap; gap:8px;}
  .cls-btn{
    flex:1 1 auto; min-width:52px; padding:11px 0; border-radius:12px; border:2px solid var(--line);
    background:#FFFCF7; color:var(--amber-deep); font-size:15px; font-family:'Baloo 2';
  }
  .cls-btn.selected{background:var(--mint); border-color:var(--mint-dark); color:#fff; font-weight:700;}

  .no-display{
    width:100%; padding:13px 14px; border-radius:14px; border:2px solid var(--line);
    background:#FFFCF7; color:var(--ink); font-size:18px; font-family:'Baloo 2';
    min-height:22px; text-align:center; letter-spacing:2px;
  }
  .no-display.placeholder{color:#C9B79E; font-family:'Gowun Dodum'; font-size:14px; letter-spacing:0;}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px;}
  .key-btn{
    padding:13px 0; border-radius:12px; border:2px solid var(--line); background:#fff;
    color:var(--ink); font-size:17px; font-family:'Baloo 2';
  }
  .key-btn:active{background:#FFF3DE;}
  .key-btn.key-clear{color:var(--coral-dark); font-size:14px;}

  button{font-family:'Baloo 2', 'Gowun Dodum', sans-serif; cursor:pointer; border:none;}
  .btn-primary{
    width:100%; margin-top:22px; padding:15px; border-radius:16px; background:var(--coral);
    color:#fff; font-size:18px; font-weight:700; box-shadow:0 6px 0 var(--coral-dark); transition:transform .05s;
  }
  .btn-primary:active{transform:translateY(4px); box-shadow:0 2px 0 var(--coral-dark);}
  .btn-primary:disabled{background:#E4D9C8; box-shadow:0 6px 0 #d3c6b0; color:#8a7a63; cursor:not-allowed;}
  .btn-secondary{
    width:100%; margin-top:10px; padding:12px; border-radius:16px; background:var(--mint);
    color:#fff; font-size:15px; font-weight:700; box-shadow:0 5px 0 var(--mint-dark);
  }
  .btn-secondary:active{transform:translateY(3px); box-shadow:0 2px 0 var(--mint-dark);}
  .btn-secondary:disabled{background:#CFE9DC; box-shadow:0 5px 0 #b9d9c9; color:#7fa393; cursor:not-allowed;}
  .btn-ghost{
    width:100%; margin-top:10px; padding:11px; border-radius:16px; background:transparent;
    color:var(--amber); font-size:14px; border:2px dashed var(--line);
  }

  .notice{margin-top:16px; background:#FFF3DE; border:2px solid #FFE2A8; border-radius:14px; padding:12px 14px; font-size:13.5px; color:var(--amber-deep); line-height:1.55;}
  .blocked{margin-top:16px; background:#FFEDEA; border:2px solid #FFC9C0; border-radius:14px; padding:14px; font-size:14px; color:var(--coral-dark); line-height:1.6;}

  .auth-box{margin-top:0; background:#FFF9F0; border:2px solid var(--line); border-radius:16px; padding:16px;}
  .auth-box .err{color:var(--coral-dark); font-size:13px; margin-top:8px;}

  /* QR box */
  .qr-box{text-align:center; background:#FFF9F0; border:2px solid var(--line); border-radius:18px; padding:18px; margin-bottom:20px;}
  .qr-box img{border-radius:12px; border:3px solid #fff; box-shadow:0 4px 0 var(--line); max-width:100%; height:auto;}
  .qr-link{font-size:12px; color:var(--amber-deep); margin-top:10px; word-break:break-all;}
  .qr-title{font-family:'Baloo 2'; color:var(--coral-dark); font-size:15px; margin-bottom:10px;}

  .sheet-embed-wrap{border-radius:16px; overflow:hidden; border:2px solid var(--line); margin-bottom:10px;}
  .sheet-embed{width:100%; height:420px; border:none; display:block;}

  /* Quiz screen */
  .progress-wrap{display:flex; align-items:center; gap:10px; margin-bottom:18px;}
  .progress-track{flex:1; height:12px; background:#F0E3D0; border-radius:8px; overflow:hidden;}
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--sun), var(--coral)); border-radius:8px; transition:width .25s ease;}
  .progress-label{font-family:'Baloo 2'; font-size:14px; color:var(--amber-deep); white-space:nowrap;}

  .q-prompt{
    font-size:23px; line-height:1.6; color:var(--ink); background:#FFFCF3;
    border:2px solid var(--line); border-radius:18px; padding:22px 20px; margin-bottom:18px;
  }
  .q-prompt b{color:var(--coral-dark);}

  .options{display:flex; flex-direction:column; gap:10px;}
  .opt{
    text-align:left; padding:16px 18px; border-radius:14px; border:2px solid var(--line);
    background:#fff; font-size:20px; font-family:'Gowun Dodum', sans-serif; color:var(--ink);
  }
  .opt:active{transform:scale(0.99);}
  .opt.opt-selected{background:#FFF3DE; border-color:var(--sun); color:var(--amber-deep); font-weight:bold;}

  .feedback{margin-top:16px; border-radius:14px; padding:14px 16px; font-size:17px; line-height:1.6;}
  .feedback.ok{background:#E6F8EF; border:2px solid #BEEBD5; color:var(--mint-dark);}
  .feedback.bad{background:#FFF3DE; border:2px solid #FFE2A8; color:var(--amber-deep);}
  .feedback .fb-title{font-family:'Baloo 2'; font-size:19px; margin-bottom:4px;}
  .feedback.bad .fb-title{color:var(--coral-dark);}

  .next-btn{margin-top:16px;}

  /* Sentence-builder question */
  .sent-badge{
    display:inline-block; background:var(--sun); color:var(--amber-deep); font-family:'Baloo 2';
    font-size:14px; padding:5px 12px; border-radius:20px; margin-bottom:10px;
  }
  .sent-image{width:100%; border-radius:16px; border:3px solid var(--line); display:block; margin-bottom:14px;}
  .sent-instruction{font-size:18px; color:var(--amber-deep); margin-bottom:12px; text-align:center;}
  .answer-slot{
    display:flex; flex-wrap:wrap; gap:8px; min-height:52px; padding:10px;
    border:2px dashed var(--mint-dark); border-radius:14px; background:#F3FBF7; margin-bottom:16px;
  }
  .slot-chip{
    padding:11px 16px; border-radius:12px; background:var(--mint-dark); color:#fff;
    font-size:19px; font-family:'Baloo 2';
  }
  .slot-placeholder{
    flex:1; text-align:center; color:#9FC9B5; font-size:14px; align-self:center;
  }
  .word-pool{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:6px;}
  .word-chip{
    padding:12px 18px; border-radius:12px; background:#fff; border:2px solid var(--line);
    color:var(--ink); font-size:19px; font-family:'Baloo 2';
  }
  .word-chip:active{transform:scale(0.97);}
  .sent-hint{text-align:center; font-size:12px; color:#B79A7C; margin-top:8px;}

  .spell-input{
    width:100%; padding:18px 16px; border-radius:14px; border:2px solid var(--line);
    font-size:24px; font-family:'Baloo 2', sans-serif; background:#FFFCF7; color:var(--ink);
    text-align:center; letter-spacing:1px;
  }
  .spell-input:focus{outline:none; border-color:var(--mint-dark); background:#fff;}

  /* Result screen */
  .score-hero{text-align:center; padding:20px 10px 8px;}
  .score-emoji{font-size:50px;}
  .score-num{font-family:'Baloo 2'; font-size:42px; color:var(--coral-dark); margin:6px 0 2px;}
  .score-sub{color:var(--amber); font-size:14px; margin-bottom:6px;}
  .attempt-tag{display:inline-block; margin-top:6px; background:var(--mint); color:#fff; font-size:12.5px; padding:5px 12px; border-radius:20px; font-family:'Baloo 2';}

  .wrong-list{margin-top:20px;}
  .wrong-title{font-family:'Baloo 2'; color:var(--amber-deep); font-size:15px; margin-bottom:10px;}
  .wrong-item{border:2px solid #FFDDD5; background:#FFF9F7; border-radius:14px; padding:12px 14px; margin-bottom:10px; font-size:14.5px; line-height:1.6;}
  .wrong-item .qp{color:var(--ink); margin-bottom:4px;}
  .wrong-item .ya{color:var(--coral-dark);}
  .wrong-item .ca{color:var(--mint-dark);}
  .wrong-item .ex{color:var(--amber-deep); font-size:13px; margin-top:4px;}
  .wrong-thumb{width:100%; max-width:220px; border-radius:10px; margin-bottom:8px; display:block;}
  .perfect{text-align:center; padding:18px; background:#E6F8EF; border:2px solid #BEEBD5; border-radius:16px; color:var(--mint-dark); font-family:'Baloo 2'; font-size:16px;}

  /* Teacher view */
  .t-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .t-title{font-family:'Baloo 2'; color:var(--coral-dark); font-size:20px;}
  .empty-state{text-align:center; padding:40px 10px; color:#B79A7C; font-size:14px; line-height:1.7;}
</style>
</head>
<body>
<div id="app"></div>

<script>

/* ---------------- Embedded QR code generator (kazuhikoarase/qrcode-generator, MIT) ---------------- */
/* Runs fully offline in the browser - no external network request needed to draw the QR code. */
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

/* ---------------- Utils ---------------- */
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function shuffledDifferent(arr){
  if(arr.length < 2) return [...arr];
  let out = shuffle(arr);
  let tries = 0;
  while(out.join('|') === arr.join('|') && tries < 10){ out = shuffle(arr); tries++; }
  return out;
}

/* ---------------- Quiz building (한 회차 안에서는 같은 문제가 나오지 않아요) ---------------- */
// 이번 시험에서 철자로 묻는 단어가 다른 문제(문장/객관식)의 글 속에 보이면 힌트가 되므로, 그런 문제는 이번 시험에서 제외해요.
function showsWord(text, words){
  const t = text.toLowerCase();
  return words.some(w => new RegExp('\\b' + w.toLowerCase() + '\\b').test(t));
}
function takeFrom(pool, fullPool, n){
  const first = shuffle(pool);
  if(first.length >= n) return first.slice(0, n);
  return first.concat(shuffle(fullPool.filter(x=>!pool.includes(x)))).slice(0, n);   // (예비) 풀이 모자랄 때만
}
function buildQuiz(){
  const must = spellBank.filter(q=>MUST_SPELL.includes(q.id));
  const optional = shuffle(spellBank.filter(q=>!MUST_SPELL.includes(q.id))).slice(0, QUOTA.spell - must.length);
  const spellPicked = [...must, ...optional];
  const spelled = spellPicked.map(q=>q.correct);

  const spell = spellPicked.map(q=>({
    id:q.id, type:'spell', prompt:q.prompt, correct:q.correct, explain:q.explain,
  }));

  const sentPool = sentenceBank.filter(s=>!showsWord([s.answer.join(' '), s.tip, s.meaning].join(' '), spelled));
  const sent = takeFrom(sentPool, sentenceBank, QUOTA.sentence).map(s=>({
    id:s.id, type:'sentence', image:s.image, meaning:s.meaning, answer:s.answer,
    poolWords: shuffledDifferent(s.answer),
    explain:`정답 문장은 "${s.answer.join(' ')}." 예요. ${s.tip}`,
  }));

  const mcqPool = mcqBank.filter(q=>!showsWord([q.prompt, q.correct, ...q.distractors, q.explain].join(' '), spelled));
  const mcq = takeFrom(mcqPool, mcqBank, QUOTA.mcq).map(q=>({
    id:q.id, type:'mcq', prompt:q.prompt, correct:q.correct, explain:q.explain,
    options: shuffle([q.correct, ...q.distractors]),
  }));

  return shuffle([...sent, ...spell, ...mcq]);
}

    </div>
  `;

  document.querySelectorAll('.cls-btn').forEach(b=>{

      if(k === '지움'){ state.student.no = ''; }
      else if(k === '⌫'){ state.student.no = state.student.no.slice(0,-1); }

    };
  });

  document.getElementById('start-btn').onclick = onStartClick;

  // 선생님 화면: 위쪽 이모지 줄을 2.5초 안에 5번 연속 탭
  const waveTrigger = document.getElementById('wave-trigger');
  let tapCount = 0;
  let tapTimer = null;
  waveTrigger.onclick = ()=>{
    tapCount++;
    if(tapTimer) clearTimeout(tapTimer);
    tapTimer = setTimeout(()=>{ tapCount = 0; }, 2500);
    if(tapCount >= 5){

      clearTimeout(tapTimer);
      state.authError = '';

function onStartClick(){
  const cls = state.student.cls;
  const no = state.student.no;
  const name = document.getElementById('in-name').value.trim();
  const box = document.getElementById('status-box');

  if(!cls){ box.innerHTML = `<div class="blocked">반을 선택해 주세요.</div>`; return; }
  if(!no){ box.innerHTML = `<div class="blocked">번호를 눌러 입력해 주세요.</div>`; return; }

  state.student = {cls, no, name};
  state.studentId = makeStudentId(state.student);

  const prior = getLocalAttempts(state.studentId);
  if(prior.length >= MAX_ATTEMPTS){
    const best = Math.max(...prior.map(a=>a.score));
    box.innerHTML = `<div class="blocked">😊 ${cls}반 ${no}번은 이 기기에서 이미 ${MAX_ATTEMPTS}번 모두 응시했어요.<br>최고 점수: <b>${best} / ${TOTAL_Q}</b><br>더 궁금한 점은 선생님께 확인해 주세요.</div>`;
    return;
  }

  state.questions = buildQuiz();
  state.qIndex = 0;
  state.answers = [];
  state.currentSentenceQId = null;
  state.screen = 'quiz';
  render();
}

/* ---------------- Quiz ---------------- */
function renderQuiz(){
  const q = state.questions[state.qIndex];
  if(q.type === 'sentence'){
    if(state.currentSentenceQId !== q.id){
      state.currentSentenceQId = q.id;
      state.sentencePool = q.poolWords.map((w,i)=>({word:w, idx:i, used:false}));
      state.sentenceOrder = [];
    }
    renderSentenceQuiz(q);
  } else if(q.type === 'spell'){
    renderSpellQuiz(q);
  } else {
    renderMcqQuiz(q);
  }
}

function progressBarHtml(){
  const pct = Math.round((state.qIndex/TOTAL_Q)*100);
  return `
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-label eng">${state.qIndex+1} / ${TOTAL_Q}</div>
    </div>
  `;
}

function nextButtonHtml(){
  const isLast = state.qIndex === TOTAL_Q - 1;
  return `<button class="btn-primary eng next-btn" id="next-btn">${isLast ? '끝! 결과 보기 🎉' : '다음 문제 →'}</button>`;
}
function goToNextQuestion(){
  if(state.qIndex === TOTAL_Q - 1){ finishQuiz(); }
  else { state.qIndex++; render(); }
}

/* ---- 객관식: 고르기만 하고 제출해야 정오답이 나와요 ---- */
function renderMcqQuiz(q){
  app.innerHTML = `
    <div class="card">
      ${progressBarHtml()}
      <div class="q-prompt">${q.prompt}</div>
      <div class="options" id="opts">
        ${q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}
      </div>
      <div id="submit-area"></div>
    </div>
  `;
  let picked = null;
  const submitArea = document.getElementById('submit-area');
  function renderSubmitBtn(){
    submitArea.innerHTML = `<button class="btn-primary eng" id="mcq-submit" ${picked===null?'disabled':''}>답안 제출</button>`;
    if(picked !== null){
      document.getElementById('mcq-submit').onclick = ()=>showMcqFeedback(q, picked);
    }
  }
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = ()=>{
      picked = q.options[+btn.dataset.i];
      document.querySelectorAll('.opt').forEach(b=>b.classList.remove('opt-selected'));
      btn.classList.add('opt-selected');
      renderSubmitBtn();
    };
  });
  renderSubmitBtn();
}

function showMcqFeedback(q, chosen){
  const isCorrect = chosen === q.correct;
  app.innerHTML = `
    <div class="card">
      ${progressBarHtml()}
      <div class="q-prompt">${q.prompt}</div>
      <div class="feedback ${isCorrect ? 'ok' : 'bad'}">
        <div class="fb-title">${isCorrect ? '✅ 정답!' : '❌ 오답이에요'}</div>
        <div style="margin-top:6px;">내가 고른 답: <b>${esc(chosen)}</b></div>
        ${isCorrect ? '' : `<div style="margin-top:6px;">정답: <b>${esc(q.correct)}</b></div><div style="margin-top:10px;">💡 ${q.explain}</div>`}
      </div>
      ${nextButtonHtml()}
    </div>
  `;
  document.getElementById('next-btn').onclick = ()=>{
    state.answers.push({id:q.id, prompt:q.prompt, chosen, correct:q.correct, explain:q.explain, isCorrect});
    goToNextQuestion();
  };
}

/* ---- 철자 쓰기 (키보드 입력) ---- */
function renderSpellQuiz(q){
  app.innerHTML = `
    <div class="card">
      ${progressBarHtml()}
      <span class="sent-badge eng">⌨️ 철자 쓰기</span>
      <div class="q-prompt">${q.prompt}</div>
      <input type="text" id="spell-input" class="spell-input eng" placeholder="영어로 입력하세요" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="en">
      <div id="submit-area"></div>
    </div>
  `;
  const input = document.getElementById('spell-input');
  const submitArea = document.getElementById('submit-area');
  function renderSubmitBtn(){
    const ready = input.value.trim().length > 0;
    submitArea.innerHTML = `<button class="btn-primary eng" id="spell-submit" ${ready?'':'disabled'}>답안 제출</button>`;
    if(ready){
      document.getElementById('spell-submit').onclick = ()=>submitSpell(q, input.value.trim());
    }
  }
  input.addEventListener('input', renderSubmitBtn);
  input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' && input.value.trim().length > 0) submitSpell(q, input.value.trim());
  });
  renderSubmitBtn();
  input.focus();
}

function submitSpell(q, typed){
  const norm = s => s.trim().toLowerCase().replace(/\s+/g,' ');
  const isCorrect = norm(typed) === norm(q.correct);
  app.innerHTML = `
    <div class="card">
      ${progressBarHtml()}
      <span class="sent-badge eng">⌨️ 철자 쓰기</span>
      <div class="q-prompt">${q.prompt}</div>
      <div class="feedback ${isCorrect ? 'ok' : 'bad'}">
        <div class="fb-title">${isCorrect ? '✅ 정답!' : '❌ 오답이에요'}</div>
        <div style="margin-top:6px;" class="eng">내가 입력한 답: <b>${esc(typed)}</b></div>
        ${isCorrect ? '' : `<div style="margin-top:6px;" class="eng">정답: <b>${esc(q.correct)}</b></div><div style="margin-top:10px;">💡 ${q.explain}</div>`}
      </div>
      ${nextButtonHtml()}
    </div>
  `;
  document.getElementById('next-btn').onclick = ()=>{
    state.answers.push({id:q.id, prompt:q.prompt, chosen:typed, correct:q.correct, explain:q.explain, isCorrect});
    goToNextQuestion();
  };
}

/* ---- 문장 만들기 (그림 카드 + 단어 순서대로 누르기) ---- */
function renderSentenceQuiz(q){
  app.innerHTML = `
    <div class="card">
      ${progressBarHtml()}
      <span class="sent-badge eng">✏️ 문장 만들기</span>
      <img class="sent-image" src="${q.image}" alt="그림 카드">
      <div class="sent-instruction">그림에 어울리는 문장이 되도록 <b>순서대로</b> 단어를 눌러보세요.</div>
      <div class="answer-slot" id="answer-slot"></div>
      <div class="word-pool" id="word-pool"></div>
      <div class="sent-hint">잘못 눌렀다면, 문장 속 단어를 다시 누르면 빠져나와요.</div>
      <div id="submit-area"></div>
    </div>
  `;
  renderSentenceInteractive(q);
}

function renderSentenceInteractive(q){
  const slot = document.getElementById('answer-slot');
  const pool = document.getElementById('word-pool');
  const total = q.poolWords.length;

  if(state.sentenceOrder.length === 0){
    slot.innerHTML = `<div class="slot-placeholder">여기에 단어를 순서대로 모아보세요</div>`;
  } else {
    slot.innerHTML = state.sentenceOrder.map(idx=>{
      const item = state.sentencePool[idx];
      return `<button class="slot-chip eng" data-idx="${idx}">${item.word}</button>`;
    }).join('');
  }
  slot.querySelectorAll('.slot-chip').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = +btn.dataset.idx;
      state.sentencePool[idx].used = false;
      state.sentenceOrder = state.sentenceOrder.filter(i=>i!==idx);
      renderSentenceInteractive(q);
    };
  });

  pool.innerHTML = state.sentencePool.filter(item=>!item.used).map(item=>
    `<button class="word-chip eng" data-idx="${item.idx}">${item.word}</button>`
  ).join('');
  pool.querySelectorAll('.word-chip').forEach(btn=>{
    btn.onclick = ()=>{
      const idx = +btn.dataset.idx;
      state.sentencePool[idx].used = true;
      state.sentenceOrder.push(idx);
      renderSentenceInteractive(q);
    };
  });

  const submitArea = document.getElementById('submit-area');
  const ready = state.sentenceOrder.length === total;
  submitArea.innerHTML = `<button class="btn-primary eng" id="sent-submit" ${ready?'':'disabled'}>제출하기</button>`;
  if(ready){
    document.getElementById('sent-submit').onclick = ()=>submitSentence(q);
  }
}

function submitSentence(q){
  const chosenWords = state.sentenceOrder.map(idx=>state.sentencePool[idx].word);
  const isCorrect = chosenWords.join(' ') === q.answer.join(' ');
  const chosenText = chosenWords.join(' ') + '.';
  const correctText = q.answer.join(' ') + '.';

  app.innerHTML = `
    <div class="card">
      ${progressBarHtml()}
      <span class="sent-badge eng">✏️ 문장 만들기</span>
      <img class="sent-image" src="${q.image}" alt="그림 카드">
      <div class="feedback ${isCorrect ? 'ok' : 'bad'}">
        <div class="fb-title">${isCorrect ? '✅ 정답!' : '❌ 오답이에요'}</div>
        <div style="margin-top:6px;" class="eng">내가 만든 문장: <b>${chosenText}</b></div>
        ${isCorrect ? '' : `<div style="margin-top:6px;" class="eng">정답: <b>${correctText}</b></div><div style="margin-top:10px;">💡 ${q.explain}</div>`}
      </div>
      ${nextButtonHtml()}
    </div>
  `;
  document.getElementById('next-btn').onclick = ()=>{
    state.answers.push({
      id:q.id,
      prompt:`✏️ "${q.meaning}" 그림에 어울리는 문장 완성하기`,
      image:q.image,
      chosen: chosenText,
      correct: correctText,
      explain:q.explain,
      isCorrect,
    });
    state.currentSentenceQId = null;
    goToNextQuestion();
  };
}

/* ---------------- Finish & Result ---------------- */
function finishQuiz(){
  const score = state.answers.filter(a=>a.isCorrect).length;
  const attempts = addLocalAttempt(state.studentId, score);
  state.lastRecord = {
    cls: state.student.cls,
    no: state.student.no,
    name: state.student.name,
    score,
    total: TOTAL_Q,
    attempt: attempts.length,
    wrongs: state.answers.filter(a=>!a.isCorrect),
  };
  state.screen = 'result';
  render();
}

function wrongItemHtml(w){
  return `
    <div class="wrong-item">
      ${w.image ? `<img class="wrong-thumb" src="${w.image}" alt="문제 그림">` : ''}
      <div class="qp">${w.prompt}</div>
      <div class="ya">내가 쓴 답: ${esc(w.chosen)}</div>
      <div class="ca">정답: ${esc(w.correct)}</div>
      <div class="ex">💡 ${w.explain}</div>
    </div>
  `;
}

function renderResult(){
  const r = state.lastRecord;
  const remain = MAX_ATTEMPTS - r.attempt;
  const pct = r.score / r.total;
  const emoji = pct===1 ? '🏆' : pct>=0.8 ? '🌟' : pct>=0.5 ? '🏠' : '🛏️';
  const subMsg = pct===1 ? '완벽해요! 최고예요!' : pct>=0.8 ? '아주 잘했어요!' : pct>=0.5 ? '조금만 더 연습해봐요!' : '다시 한 번 복습해볼까요?';

  const who = `${r.cls}반 ${r.no}번${r.name ? ' ' + esc(r.name) : ''}`;
  const wrongsHtml = r.wrongs.length === 0
    ? `<div class="perfect">🎉 오답이 없어요! 모두 정답이에요!</div>`
    : `<div class="wrong-list">
        <div class="wrong-title">틀린 문제 다시 보기 (${r.wrongs.length}개)</div>
        ${r.wrongs.map(wrongItemHtml).join('')}
      </div>`;

  app.innerHTML = `
    <div class="card">
      <div class="score-hero">
        <div class="score-emoji">${emoji}</div>
        <div class="hint" style="font-size:14px;margin-bottom:4px;">${who}</div>
        <div class="score-num eng">${r.score} / ${r.total}</div>
        <div class="score-sub">${subMsg}</div>
        <span class="attempt-tag eng">${r.attempt} / ${MAX_ATTEMPTS} 회 응시</span>
      </div>
      <div class="notice" style="text-align:center;">📱 이 화면을 선생님께 보여드리세요!</div>
      ${wrongsHtml}
      ${remain > 0
        ? `<button class="btn-secondary eng" id="retry-btn">다시 도전하기 (남은 기회 ${remain}회)</button>
           <div class="hint" style="text-align:center;margin-top:6px;">다시 도전하면 문제가 새로 섞여서 나와요.</div>`
        : `<div class="notice">이번 시험은 ${MAX_ATTEMPTS}번 모두 사용했어요. 수고했어요! 🏠</div>`}
      <button class="btn-ghost eng" id="home-btn">처음 화면으로</button>
    </div>
  `;

  if(remain > 0){
    document.getElementById('retry-btn').onclick = ()=>{
      state.questions = buildQuiz();
      state.qIndex = 0;
      state.answers = [];
      state.currentSentenceQId = null;
      state.screen = 'quiz';
      render();
    };
  }
  document.getElementById('home-btn').onclick = ()=>{
    state.screen = 'start';
    state.student = {cls:'', no:'', name:''};
    render();
  };
}

/* ---------------- Teacher: gate + QR ---------------- */
function renderTeacherGate(){
  app.innerHTML = `
    <div class="wave">👩‍🏫 📋 ✅</div>
    <div class="card">
      <h1>선생님 화면</h1>
      <p class="subtitle">Lesson 9 단어 시험 · 학생 접속 QR</p>

      </div>
      <button class="btn-ghost eng" id="back-to-start-btn">← 학생 화면으로</button>
    </div>
  `;
  document.getElementById('pw-confirm').onclick = ()=>{
    const val = document.getElementById('pw-input').value;
    if(val === TEACHER_PASSWORD){
      state.authError = '';
      state.screen = 'teacher';
      render();

      state.authError = '비밀번호가 올바르지 않아요.';

}

function generateQrDataUrl(text){
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const moduleCount = qr.getModuleCount();
  const marginModules = 4;                     // QR 규격 권장 여백(quiet zone) 4칸
  const targetTotal = 280;
  let cellSize = Math.floor(targetTotal / (moduleCount + marginModules * 2));
  if(cellSize < 4) cellSize = 4;
  const margin = cellSize * marginModules;
  const size = moduleCount * cellSize + margin * 2;
  return { dataUrl: qr.createDataURL(cellSize, margin), size };
}

        <input type="text" id="url-override-input" placeholder="https://...">

        <div class="hint" style="margin-top:10px;">자동 감지된 주소: <span class="eng">${esc(detected)}</span></div>
      </div>

      <div class="notice">채점 결과는 학생 화면(결과 화면)에 바로 표시돼요. 학생이 시험을 마치면 그 화면을 선생님께 직접 보여주도록 안내해 주세요.<br>학생은 반+번호 기준으로 최대 ${MAX_ATTEMPTS}회까지 응시해요. 한 회차 안에서는 같은 문제가 나오지 않고, 2·3회차에는 이전 문제가 다시 나올 수 있어요.<br>매 회 20문항 = 철자 쓰기 7 (bookshelf·bathtub 고정 + closet·stove·same·kitchen·bathroom·bedroom·garden 중 5개) + 문장 만들기 5 + 객관식 8.</div>
    </div>
  `;

  document.getElementById('url-override-input').value = override;
